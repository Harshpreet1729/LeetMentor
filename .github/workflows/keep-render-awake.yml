name: Keep Render service awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping-health-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping LeetMentor health endpoint
        run: >-
          curl --fail --show-error --silent
          --retry 5 --retry-all-errors --retry-delay 10
          --connect-timeout 30 --max-time 120
          https://leetmentor-1ya8.onrender.com/api/health/
